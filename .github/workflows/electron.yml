name: Build App

on:
  push:
    branches:
      - prod

  workflow_dispatch:

# Empêche deux releases de se construire
# simultanément avec le même numéro.
concurrency:
  group: modyx-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  build-windows:

    name: Build Windows

    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. RÉCUPÉRER LE CODE
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALLER NODE.JS
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json


      # ============================================================
      # 3. CALCULER LA PROCHAINE VERSION
      # ============================================================

      - name: Determine next version
        id: version
        uses: actions/github-script@v7

        env:
          RELEASE_REPO: Arthur640-ctrl/Modyx-Releases

        with:
          github-token: ${{ secrets.MODYX_RELEASE_TOKEN }}

          script: |

            const fs = require("fs");


            // --------------------------------------------------------
            // Repository cible
            // --------------------------------------------------------

            const [owner, repo] =
              process.env.RELEASE_REPO.split("/");


            // --------------------------------------------------------
            // Lire package.json
            // --------------------------------------------------------

            const packageJson =
              JSON.parse(
                fs.readFileSync(
                  "app/package.json",
                  "utf8"
                )
              );


            const sourceVersion =
              packageJson.version;


            console.log(
              `Version source : ${sourceVersion}`
            );


            // --------------------------------------------------------
            // Parser une version
            // --------------------------------------------------------

            function parseVersion(version) {

              const clean =
                version.replace(/^v/, "");


              const match =
                clean.match(
                  /^(\d+)\.(\d+)\.(\d+)$/
                );


              if (!match) {

                throw new Error(
                  `Version invalide : ${version}`
                );

              }


              return {

                major: Number(match[1]),
                minor: Number(match[2]),
                patch: Number(match[3])

              };

            }


            // --------------------------------------------------------
            // Comparer deux versions
            // --------------------------------------------------------

            function compareVersions(a, b) {

              if (a.major !== b.major) {

                return a.major - b.major;

              }


              if (a.minor !== b.minor) {

                return a.minor - b.minor;

              }


              return a.patch - b.patch;

            }


            // --------------------------------------------------------
            // +1 patch
            // --------------------------------------------------------

            function incrementPatch(version) {

              return {

                major: version.major,
                minor: version.minor,
                patch: version.patch + 1

              };

            }


            // --------------------------------------------------------
            // Version → texte
            // --------------------------------------------------------

            function versionToString(version) {

              return `${version.major}.${version.minor}.${version.patch}`;

            }


            // ========================================================
            // VERSION INITIALE
            // ========================================================

            let nextVersion;


            /*
             * 0.0.0 signifie :
             *
             * "aucune version de production définie"
             *
             * La première release est donc 1.0.0.
             */

            if (sourceVersion === "0.0.0") {

              nextVersion = {

                major: 1,
                minor: 0,
                patch: 0

              };

            } else {

              nextVersion =
                incrementPatch(
                  parseVersion(sourceVersion)
                );

            }


            // ========================================================
            // REGARDER LA DERNIÈRE RELEASE PUBLIÉE
            // ========================================================

            try {

              const { data } =
                await github.rest.repos.getLatestRelease({

                  owner,
                  repo

                });


              const latestVersion =
                parseVersion(
                  data.tag_name
                );


              console.log(
                `Dernier release : ${versionToString(latestVersion)}`
              );


              const releaseCandidate =
                incrementPatch(
                  latestVersion
                );


              /*
               * On prend toujours le numéro le plus élevé
               * entre package.json et la dernière release.
               */

              if (
                compareVersions(
                  releaseCandidate,
                  nextVersion
                ) > 0
              ) {

                nextVersion =
                  releaseCandidate;

              }


            } catch (error) {

              /*
               * 404 = aucune release publiée.
               *
               * C'est parfaitement normal pour la
               * toute première release.
               */

              if (error.status === 404) {

                console.log(
                  "Aucun release existant."
                );

              } else {

                throw error;

              }

            }


            // ========================================================
            // VERSION FINALE
            // ========================================================

            const versionString =
              versionToString(
                nextVersion
              );


            console.log(
              `Prochaine version : ${versionString}`
            );


            core.setOutput(
              "version",
              versionString
            );


      # ============================================================
      # 4. METTRE LA VERSION DANS package.json
      # ============================================================

      - name: Set application version
        working-directory: app

        env:
          VERSION: ${{ steps.version.outputs.version }}

        shell: pwsh

        run: |

          Write-Host "Version choisie : $env:VERSION"

          npm version $env:VERSION --no-git-tag-version

          Write-Host ""
          Write-Host "Version package.json :"

          node -p "require('./package.json').version"


      # ============================================================
      # 5. INSTALLER LES DEPENDANCES
      # ============================================================

      - name: Install dependencies
        working-directory: app
        run: npm ci


      # ============================================================
      # 6. BUILD VITE
      # ============================================================

      - name: Build frontend
        working-directory: app
        run: npm run build


      # ============================================================
      # 7. CRÉER LE TAG DANS Modyx-Releases
      # ============================================================

      - name: Create release tag
        id: tag
        uses: actions/github-script@v7

        env:
          RELEASE_REPO: Arthur640-ctrl/Modyx-Releases
          VERSION: ${{ steps.version.outputs.version }}

        with:

          github-token: ${{ secrets.MODYX_RELEASE_TOKEN }}

          script: |

            const [owner, repo] =
              process.env.RELEASE_REPO.split("/");


            const tag =
              `v${process.env.VERSION}`;


            console.log(
              `Tag demandé : ${tag}`
            );


            // --------------------------------------------------------
            // Vérifier si le tag existe déjà
            // --------------------------------------------------------

            try {

              await github.rest.git.getRef({

                owner,
                repo,
                ref: `tags/${tag}`

              });


              /*
               * Le tag existe déjà.
               *
               * Ça arrive notamment si un workflow précédent
               * a planté APRÈS avoir créé le tag.
               *
               * Ce n'est PAS une erreur.
               */

              console.log(
                `Le tag ${tag} existe déjà.`
              );


              return;

            } catch (error) {

              if (error.status !== 404) {

                throw error;

              }

            }


            // --------------------------------------------------------
            // Récupérer la branche principale du repo release
            // --------------------------------------------------------

            const {
              data: repository
            } =
              await github.rest.repos.get({

                owner,
                repo

              });


            const defaultBranch =
              repository.default_branch;


            // --------------------------------------------------------
            // Récupérer le commit actuel
            // --------------------------------------------------------

            const {
              data: branch
            } =
              await github.rest.repos.getBranch({

                owner,
                repo,

                branch: defaultBranch

              });


            const sha =
              branch.commit.sha;


            console.log(
              `Commit cible : ${sha}`
            );


            // --------------------------------------------------------
            // Créer le tag
            // --------------------------------------------------------

            await github.rest.git.createRef({

              owner,
              repo,

              ref: `refs/tags/${tag}`,

              sha

            });


            console.log(
              `Tag ${tag} créé avec succès.`
            );


      # ============================================================
      # 8. BUILD ELECTRON + PUBLICATION GITHUB
      # ============================================================

      - name: Build and publish Windows
        working-directory: app

        env:
          GH_TOKEN: ${{ secrets.MODYX_RELEASE_TOKEN }}

        run: |

          npx electron-builder --win --publish always
