name: Build App

on:
  push:
    branches:
      - prod

  workflow_dispatch:

# Empêche deux releases de calculer exactement
# la même version en même temps.
concurrency:
  group: modyx-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:

      # --------------------------------------------------
      # 1. Récupération du code
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Installation de Node.js
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json


      # --------------------------------------------------
      # 3. Calcul automatique de la prochaine version
      # --------------------------------------------------

      - name: Determine next version
        id: version
        uses: actions/github-script@v7

        env:
          RELEASE_REPO: Arthur640-ctrl/Modyx-Releases

        with:
          github-token: ${{ secrets.MODYX_RELEASE_TOKEN }}

          script: |
            const fs = require("fs");

            const [owner, repo] =
              process.env.RELEASE_REPO.split("/");

            // ------------------------------------------------
            // Version présente dans le repository source
            // ------------------------------------------------

            const packageJson =
              JSON.parse(
                fs.readFileSync(
                  "app/package.json",
                  "utf8"
                )
              );

            const sourceVersion =
              packageJson.version;

            function parseVersion(version) {
              const clean = version.replace(/^v/, "");

              const match =
                clean.match(
                  /^(\d+)\.(\d+)\.(\d+)$/
                );

              if (!match) {
                throw new Error(
                  `Version invalide : ${version}`
                );
              }

              return {
                major: Number(match[1]),
                minor: Number(match[2]),
                patch: Number(match[3])
              };
            }

            function compareVersions(a, b) {
              if (a.major !== b.major) {
                return a.major - b.major;
              }

              if (a.minor !== b.minor) {
                return a.minor - b.minor;
              }

              return a.patch - b.patch;
            }

            function incrementPatch(version) {
              return {
                major: version.major,
                minor: version.minor,
                patch: version.patch + 1
              };
            }

            function versionToString(version) {
              return `${version.major}.${version.minor}.${version.patch}`;
            }

            // ------------------------------------------------
            // On commence avec la version source + 1
            // ------------------------------------------------

            let nextVersion =
              incrementPatch(
                parseVersion(sourceVersion)
              );

            console.log(
              `Version source : ${sourceVersion}`
            );

            // ------------------------------------------------
            // On regarde le dernier release public
            // ------------------------------------------------

            try {
              const { data } =
                await github.rest.repos.getLatestRelease({
                  owner,
                  repo
                });

              const latestVersion =
                parseVersion(data.tag_name);

              console.log(
                `Dernier release : ${versionToString(latestVersion)}`
              );

              const releaseCandidate =
                incrementPatch(latestVersion);

              // On prend la plus grande des deux.
              //
              // Exemple :
              //
              // package.json = 1.0.4
              // dernier release = 1.0.1
              //
              // => 1.0.5
              //
              // Puis :
              //
              // package.json = 1.0.4
              // dernier release = 1.0.5
              //
              // => 1.0.6

              if (
                compareVersions(
                  releaseCandidate,
                  nextVersion
                ) > 0
              ) {
                nextVersion =
                  releaseCandidate;
              }

            } catch (error) {

              // Aucun release existant.
              // On conserve package.json + 1.

              if (error.status === 404) {
                console.log(
                  "Aucun release existant."
                );
              } else {
                throw error;
              }
            }

            const versionString =
              versionToString(nextVersion);

            console.log(
              `Prochaine version : ${versionString}`
            );

            core.setOutput(
              "version",
              versionString
            );


      # --------------------------------------------------
      # 4. Injecte la version dans package.json
      # --------------------------------------------------

      - name: Set application version
        working-directory: app

        env:
          VERSION: ${{ steps.version.outputs.version }}

        shell: pwsh

        run: |
          Write-Host "Version choisie : $env:VERSION"

          npm version $env:VERSION --no-git-tag-version

          Write-Host ""
          Write-Host "Version package.json :"

          node -p "require('./package.json').version"


      # --------------------------------------------------
      # 5. Installation des dépendances
      # --------------------------------------------------

      - name: Install dependencies
        working-directory: app
        run: npm ci


      # --------------------------------------------------
      # 6. Build + création du GitHub Release
      # --------------------------------------------------

      - name: Build and publish Windows
        working-directory: app

        env:
          GH_TOKEN: ${{ secrets.MODYX_RELEASE_TOKEN }}

        run: |
          npx electron-builder --win --publish always
