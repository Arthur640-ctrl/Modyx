```yaml
name: Build App

on:
  push:
    branches:
      - prod

  workflow_dispatch:

# Un seul release à la fois.
concurrency:
  group: modyx-release
  cancel-in-progress: false

permissions:
  contents: read


jobs:

  build-windows:

    name: Build Windows

    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE.JS
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json


      # ============================================================
      # 3. CALCULER LA PROCHAINE VERSION
      # ============================================================

      - name: Determine next version
        id: version
        uses: actions/github-script@v7

        env:
          RELEASE_REPO: Arthur640-ctrl/Modyx-Releases

        with:
          github-token: ${{ secrets.MODYX_RELEASE_TOKEN }}

          script: |

            const fs = require("fs");


            // ========================================================
            // CONFIGURATION
            // ========================================================

            const [
              owner,
              repo
            ] =
              process.env.RELEASE_REPO.split("/");


            // ========================================================
            // VERSION DU package.json
            // ========================================================

            const packageJson =
              JSON.parse(
                fs.readFileSync(
                  "app/package.json",
                  "utf8"
                )
              );


            const sourceVersion =
              packageJson.version;


            console.log(
              `Version source : ${sourceVersion}`
            );


            // ========================================================
            // PARSER VERSION
            // ========================================================

            function parseVersion(version) {

              const clean =
                version.replace(/^v/, "");


              const match =
                clean.match(
                  /^(\d+)\.(\d+)\.(\d+)$/
                );


              if (!match) {

                return null;

              }


              return {

                major: Number(match[1]),
                minor: Number(match[2]),
                patch: Number(match[3])

              };

            }


            // ========================================================
            // COMPARER
            // ========================================================

            function compareVersions(a, b) {

              if (a.major !== b.major) {

                return a.major - b.major;

              }


              if (a.minor !== b.minor) {

                return a.minor - b.minor;

              }


              return a.patch - b.patch;

            }


            // ========================================================
            // +1 PATCH
            // ========================================================

            function incrementPatch(version) {

              return {

                major: version.major,
                minor: version.minor,
                patch: version.patch + 1

              };

            }


            // ========================================================
            // STRING
            // ========================================================

            function versionToString(version) {

              return (
                `${version.major}.${version.minor}.${version.patch}`
              );

            }


            // ========================================================
            // VERSION DE BASE
            // ========================================================

            let nextVersion;


            if (sourceVersion === "0.0.0") {

              nextVersion = {

                major: 1,
                minor: 0,
                patch: 0

              };

            } else {

              const parsedSource =
                parseVersion(sourceVersion);


              if (!parsedSource) {

                throw new Error(
                  `Version source invalide : ${sourceVersion}`
                );

              }


              nextVersion =
                incrementPatch(
                  parsedSource
                );

            }


            // ========================================================
            // RÉCUPÉRER TOUTES LES RELEASES
            // ========================================================

            console.log(
              "Recherche de toutes les releases..."
            );


            let releases = [];


            for (let page = 1; page <= 10; page++) {

              const {
                data
              } =
                await github.rest.repos.listReleases({

                  owner,
                  repo,

                  per_page: 100,

                  page

                });


              if (data.length === 0) {

                break;

              }


              releases.push(
                ...data
              );


              if (data.length < 100) {

                break;

              }

            }


            console.log(
              `Releases trouvées : ${releases.length}`
            );


            // ========================================================
            // TROUVER LA VERSION MAXIMALE
            // ========================================================

            let highestRelease = null;


            for (const release of releases) {

              const parsed =
                parseVersion(
                  release.tag_name
                );


              if (!parsed) {

                continue;

              }


              console.log(
                `Release trouvée : ${release.tag_name}`
              );


              if (
                highestRelease === null ||
                compareVersions(
                  parsed,
                  highestRelease
                ) > 0
              ) {

                highestRelease =
                  parsed;

              }

            }


            // ========================================================
            // CALCUL FINAL
            // ========================================================

            if (highestRelease !== null) {

              const candidate =
                incrementPatch(
                  highestRelease
                );


              if (
                compareVersions(
                  candidate,
                  nextVersion
                ) > 0
              ) {

                nextVersion =
                  candidate;

              }

            }


            // ========================================================
            // RÉSULTAT
            // ========================================================

            const versionString =
              versionToString(
                nextVersion
              );


            console.log(
              "========================================"
            );

            console.log(
              `Prochaine version : ${versionString}`
            );

            console.log(
              "========================================"
            );


            core.setOutput(
              "version",
              versionString
            );


      # ============================================================
      # 4. MODIFIER package.json DANS LE RUNNER
      # ============================================================

      - name: Set application version
        working-directory: app

        env:
          VERSION: ${{ steps.version.outputs.version }}

        shell: pwsh

        run: |

          Write-Host "Version choisie : $env:VERSION"

          npm version $env:VERSION --no-git-tag-version

          Write-Host ""
          Write-Host "Version package.json :"

          node -p "require('./package.json').version"


      # ============================================================
      # 5. INSTALLER LES DEPENDANCES
      # ============================================================

      - name: Install dependencies
        working-directory: app
        run: npm ci


      # ============================================================
      # 6. BUILD VITE
      # ============================================================

      - name: Build frontend
        working-directory: app
        run: npm run build


      # ============================================================
      # 7. CRÉER TAG + RELEASE AVANT ELECTRON-BUILDER
      # ============================================================

      - name: Prepare GitHub release
        id: release
        uses: actions/github-script@v7

        env:
          RELEASE_REPO: Arthur640-ctrl/Modyx-Releases
          VERSION: ${{ steps.version.outputs.version }}

        with:

          github-token: ${{ secrets.MODYX_RELEASE_TOKEN }}

          script: |

            const [
              owner,
              repo
            ] =
              process.env.RELEASE_REPO.split("/");


            const version =
              process.env.VERSION;


            const tag =
              `v${version}`;


            console.log(
              `Préparation de ${tag}`
            );


            // ========================================================
            // VÉRIFIER SI LE TAG EXISTE
            // ========================================================

            let tagExists = false;


            try {

              await github.rest.git.getRef({

                owner,
                repo,

                ref: `tags/${tag}`

              });


              tagExists = true;


              console.log(
                `Le tag ${tag} existe déjà.`
              );

            } catch (error) {

              if (error.status !== 404) {

                throw error;

              }

            }


            // ========================================================
            // CRÉER LE TAG SI NÉCESSAIRE
            // ========================================================

            if (!tagExists) {

              const {
                data: repository
              } =
                await github.rest.repos.get({

                  owner,
                  repo

                });


              const defaultBranch =
                repository.default_branch;


              const {
                data: branch
              } =
                await github.rest.repos.getBranch({

                  owner,
                  repo,

                  branch: defaultBranch

                });


              const sha =
                branch.commit.sha;


              console.log(
                `Création du tag ${tag} sur ${sha}`
              );


              await github.rest.git.createRef({

                owner,
                repo,

                ref: `refs/tags/${tag}`,

                sha

              });


              console.log(
                `Tag ${tag} créé.`
              );

            }


            // ========================================================
            // VÉRIFIER SI LA RELEASE EXISTE
            // ========================================================

            let releaseExists = false;


            try {

              const {
                data: existingRelease
              } =
                await github.rest.repos.getReleaseByTag({

                  owner,
                  repo,

                  tag

                });


              releaseExists = true;


              console.log(
                `La release ${tag} existe déjà.`
              );


              console.log(
                `Release ID : ${existingRelease.id}`
              );

            } catch (error) {

              if (error.status !== 404) {

                throw error;

              }

            }


            // ========================================================
            // CRÉER LA RELEASE SI NÉCESSAIRE
            // ========================================================

            if (!releaseExists) {

              console.log(
                `Création de la release ${tag}...`
              );


              const {
                data: createdRelease
              } =
                await github.rest.repos.createRelease({

                  owner,
                  repo,

                  tag_name: tag,

                  name: version,

                  body:
                    `Modyx ${version}`,

                  draft: false,

                  prerelease: false

                });


              console.log(
                `Release créée avec succès.`
              );


              console.log(
                `Release ID : ${createdRelease.id}`
              );

            }


      # ============================================================
      # 8. ELECTRON-BUILDER
      # ============================================================

      - name: Build and publish Windows
        working-directory: app

        env:
          GH_TOKEN: ${{ secrets.MODYX_RELEASE_TOKEN }}

        run: |

          npx electron-builder --win --publish always
```
